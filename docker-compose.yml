services:
  pdf2json:
    build:
      context: .
      args:
        # Ponlo a 1 para incluir Tesseract y poder activar OCR_ENABLED.
        CON_OCR: "${CON_OCR:-0}"
    ports:
      # Izquierda: puerto del servidor, se cambia con PUERTO en .env.
      # Derecha: puerto dentro del contenedor, siempre 8000 (lo fija el Dockerfile).
      - "${PUERTO:-8000}:8000"
    # Los PDF temporales viven en RAM y desaparecen al reiniciar: nunca tocan el disco.
    tmpfs:
      - /tmp
    # Los valores se ajustan en el fichero .env de al lado, sin tocar este fichero.
    environment:
      MAX_FILE_MB: "${MAX_FILE_MB:-25}"
      MAX_FILES: "${MAX_FILES:-10}"
      MAX_PAGES: "${MAX_PAGES:-500}"
      RATE_LIMIT: "${RATE_LIMIT:-10/minute}"
      CONVERT_TIMEOUT_S: "${CONVERT_TIMEOUT_S:-30}"
      MAX_REQUEST_MB: "${MAX_REQUEST_MB:-60}"
      MAX_CONCURRENTES: "${MAX_CONCURRENTES:-4}"
      OCR_ENABLED: "${OCR_ENABLED:-0}"
      LEGAL_TITULAR: "${LEGAL_TITULAR:-TecXarT}"
      LEGAL_EMAIL: "${LEGAL_EMAIL:-tecxart@gmail.com}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
